name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
      - name: Install frontend
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Install server
        run: npm --prefix server ci --no-audit --no-fund
      - name: Local setup configuration checks
        run: npm run test:bootstrap
      - name: Frontend types and build
        run: npm --prefix frontend run build
      - name: Server types
        run: npm --prefix server run typecheck
      - name: Server build
        run: npm --prefix server run build
      - name: Demo API policy checks
        run: npm run test:demo

  inference:
    name: Python 3.12 / CPU contract
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: '1'
      MODEL_BACKEND: pytorch
      MODEL_WEIGHTS: weights/ci-not-provided.pt
      MODEL_INPUT_SIZE: '224'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: inference/requirements-win-cpu.lock.txt
      - name: Install locked CPU dependencies
        run: python -m pip install -r inference/requirements-win-cpu.lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Dependency consistency
        run: python -m pip check
      - name: Python syntax
        run: python -m compileall -q inference/main.py inference/model_runtime inference/training scripts/ci-model-contract.py
      - name: Import and contract checks without private data
        run: python scripts/ci-model-contract.py
      - name: Inference concurrency checks
        run: python scripts/ci-concurrency.py
      - name: Model download integrity checks
        run: python scripts/ci-download-model.py
      - name: Image input rejection checks
        run: python scripts/ci-image-input.py

  publication:
    name: Publication hygiene
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect source candidates
        run: npm run check:release
      - name: Inspect tracked paths
        run: node scripts/ci-source-hygiene.mjs

  containers:
    name: Linux container preparation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated CI configuration
        run: node deploy/configure.mjs demo.example.test
      - name: Validate Compose and build container images
        run: |
          docker compose --env-file deploy/.env config --quiet
          docker compose --env-file deploy/.env build web inference demo-init
      - name: Linux Python import and download checks
        run: |
          docker compose --env-file deploy/.env run --rm --no-deps inference python -c 'import main,torch,torchvision,transformers'
          docker compose --env-file deploy/.env run --rm --no-deps inference python /app/scripts/ci-download-model.py
      - name: Initialize isolated MySQL and demo accounts
        run: |
          docker compose --env-file deploy/.env up -d --wait --wait-timeout 180 db
          docker compose --env-file deploy/.env run --rm --no-deps demo-init
          docker compose --env-file deploy/.env run --rm --no-deps web node /app/scripts/ci-demo.mjs
      - name: Stop isolated CI services
        if: always()
        run: docker compose --env-file deploy/.env down
